edition = "2024";

// Native Generation API (ADR 0006): submit, status, result, and event streaming
// that survive disconnection. Served over the Connect protocol with binary or
// JSON codecs (ADR 0004) and authenticated with the Tenant Master Key.
package gpq.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "gpq/v1/common.proto";
import "gpq/v1/catalog.proto";

option features.field_presence = IMPLICIT;

// One tenant request for one generated result.
message Generation {
  string generation_id = 1;
  GenerationState state = 2;
  Modality modality = 3;
  string model_alias = 4;
  // Immutable content hash resolved at admission (ADR 0012).
  string version_sha256 = 5;
  uint32 priority = 6;
  uint64 seed = 7;
  google.protobuf.Duration execution_timeout = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp updated_at = 10;
  uint32 attempt_count = 11;
  repeated ArtifactRef output_artifacts = 13;
  Failure failure = 15;
  Progress latest_progress = 16;
  reserved 12, 14;
  reserved alias, output_text, usage;
}

message ImageParameters {
  string prompt = 1;
  string negative_prompt = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 steps = 5 [features.field_presence = EXPLICIT];
  float cfg_scale = 6 [features.field_presence = EXPLICIT];
  repeated string reference_artifact_ids = 7;
  repeated LoraSelection loras = 8;
  repeated float sigmas = 9;
}

message VideoParameters {
  string prompt = 1;
  string negative_prompt = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 frames = 5;
  string first_frame_artifact_id = 6 [features.field_presence = EXPLICIT];
  string last_frame_artifact_id = 7 [features.field_presence = EXPLICIT];
}

message SubmitRequest {
  // Exactly one model alias; modality is derived from its resolved version.
  oneof target {
    string model_alias = 1;
  }
  ArtifactPlacement output_placement = 5;
  // Zero through nine; omitted means the Tenant default.
  uint32 priority = 6;
  uint64 seed = 7 [features.field_presence = EXPLICIT];
  // May only shorten the resolved timeout (ADR 0003).
  google.protobuf.Duration execution_timeout = 8 [features.field_presence = EXPLICIT];
  oneof generation_parameters {
    ImageParameters image_parameters = 9;
    VideoParameters video_parameters = 10;
  }
  reserved 2, 3, 4;
  reserved workflow_alias, parameters, input_artifact_ids;
}

message SubmitResponse {
  Generation generation = 1;
}

message GetGenerationRequest {
  string generation_id = 1;
}

message GetGenerationResponse {
  Generation generation = 1;
}

message CancelGenerationRequest {
  string generation_id = 1;
}

message CancelGenerationResponse {
  Generation generation = 1;
}

message ListGenerationsRequest {
  uint32 page_size = 1;
  string page_token = 2;
  GenerationState state = 3;
}

message ListGenerationsResponse {
  repeated Generation generations = 1;
  string next_page_token = 2;
}

message WatchGenerationRequest {
  string generation_id = 1;
}

// A reconnected stream starts with a snapshot, then live events; any gap is
// explicit (ADR 0006).
message GenerationEvent {
  google.protobuf.Timestamp emitted_at = 1;
  oneof event {
    Generation snapshot = 2;
    StateChanged state_changed = 3;
    Progress progress = 4;
    Discontinuity discontinuity = 6;
  }
  reserved 5;
  reserved token_delta;
}

message StateChanged {
  GenerationState state = 1;
  uint32 attempt_count = 2;
  Failure failure = 3;
}


// Emitted when live events were dropped, e.g. across a reconnect.
message Discontinuity {
  string reason = 1;
}

// Native inputs may use persistent Remote-local storage without S3; ObjectStore
// placement remains available for queued work that moves between Workers.
// Remote alone holds object-store credentials and issues object-scoped URLs.
message CreateInputArtifactRequest {
  ArtifactManifest manifest = 1;
}

message CreateInputArtifactResponse {
  string artifact_id = 1;
  string upload_url = 2;
  google.protobuf.Timestamp upload_url_expires_at = 3;
}

service GenerationService {
  rpc Submit(SubmitRequest) returns (SubmitResponse);
  rpc GetGeneration(GetGenerationRequest) returns (GetGenerationResponse);
  rpc CancelGeneration(CancelGenerationRequest) returns (CancelGenerationResponse);
  rpc ListGenerations(ListGenerationsRequest) returns (ListGenerationsResponse);
  rpc WatchGeneration(WatchGenerationRequest) returns (stream GenerationEvent);
  rpc CreateInputArtifact(CreateInputArtifactRequest) returns (CreateInputArtifactResponse);
}
