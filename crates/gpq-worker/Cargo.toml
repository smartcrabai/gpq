[package]
description = "Tenant-owned GPU worker for GPU Generation Queue"
edition.workspace = true
homepage = "https://github.com/smartcrabai/gpq"
license.workspace = true
name = "gpq-worker"
repository.workspace = true
version.workspace = true

[package.metadata.dist]
# ADR 0020: the Worker is a library of the single gpq executable (crates/gpq).
dist = false

[features]
cuda = ["gpq-inference/cuda"]
metal = ["gpq-inference/metal"]
vulkan = ["gpq-inference/vulkan"]

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
buffa.workspace = true
buffa-types.workspace = true
chrono.workspace = true
clap.workspace = true
connectrpc.workspace = true
futures.workspace = true
gpq-domain.workspace = true
gpq-inference.workspace = true
gpq-proto.workspace = true
http.workspace = true
rand.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tokio-tungstenite.workspace = true
tokio-util.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
keyring.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
