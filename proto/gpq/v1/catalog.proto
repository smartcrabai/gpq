edition = "2024";

// Catalog API (ADR 0012): Workers advertise immutable Model Versions by
// content hash; Tenant APIs map model aliases. Alias deletion or reassignment
// never mutates versions or past Generations.
package gpq.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

option features.field_presence = IMPLICIT;

enum ModelFamily {
  MODEL_FAMILY_UNSPECIFIED = 0;
  MODEL_FAMILY_QWEN_IMAGE21 = 1;
  MODEL_FAMILY_MINIMAX_H3 = 2;
}

enum ModelAssetRole {
  MODEL_ASSET_ROLE_UNSPECIFIED = 0;
  MODEL_ASSET_ROLE_DIFFUSION = 1;
  MODEL_ASSET_ROLE_TEXT_ENCODER = 2;
  MODEL_ASSET_ROLE_VISION_ENCODER = 3;
  MODEL_ASSET_ROLE_VAE = 4;
  MODEL_ASSET_ROLE_AUDIO_VAE = 5;
}

message ModelAsset {
  ModelAssetRole role = 1;
  string sha256 = 2;
}

message LoraSelection {
  string sha256 = 1;
  float scale = 2;
}

message SamplingPreset {
  uint32 steps = 1;
  float cfg_scale = 2;
  repeated float sigmas = 3;
}

message ModelManifest {
  ModelFamily family = 1;
  repeated ModelAsset assets = 2;
  repeated LoraSelection default_loras = 3;
  SamplingPreset sampling = 4;
}

message ModelAdvertisement {
  string version_sha256 = 1;
  ModelManifest manifest = 2;
}

message ShapeLimits {
  uint64 max_image_pixels = 1 [features.field_presence = EXPLICIT];
  uint64 max_video_pixels = 2 [features.field_presence = EXPLICIT];
  uint32 max_video_frames = 3 [features.field_presence = EXPLICIT];
  uint32 max_steps = 4 [features.field_presence = EXPLICIT];
}

// Exact model material advertised by capable Workers.
message ModelVersion {
  string content_sha256 = 1;
  google.protobuf.Duration execution_timeout = 3 [features.field_presence = EXPLICIT];
  uint64 estimated_memory_bytes = 4 [features.field_presence = EXPLICIT];
  // Workers that currently advertise this version and hold an online session.
  uint32 online_worker_count = 5;
  google.protobuf.Timestamp first_seen_at = 6;
  ModelManifest manifest = 7;
  reserved 2;
  reserved modality, estimated_vram_bytes;
}

message ModelAlias {
  string alias = 1;
  string content_sha256 = 2;
  bool available = 4;
  reserved 3;
  reserved modality;
}

// A Device Pool's Active Accelerator and Execution Slots as last reported.
message PoolSummary {
  string pool_id = 1;
  string backend_version = 3;
  uint32 total_slots = 4;
  uint32 free_slots = 5;
  string resident_model_sha256 = 6;
  uint64 accelerator_memory_bytes = 7 [features.field_presence = EXPLICIT];
  string accelerator = 8;
  reserved 2;
  reserved backend_kind;
}

message WorkerSummary {
  string worker_id = 1;
  string name = 2;
  bool online = 3;
  string worker_version = 4;
  google.protobuf.Timestamp last_seen_at = 5;
  repeated PoolSummary pools = 6;
  repeated string model_sha256 = 7;
  reserved 8;
  reserved custom_nodes;
}

message SetModelAliasRequest {
  string alias = 1;
  string content_sha256 = 2;
}

message SetModelAliasResponse {
  ModelAlias alias = 1;
}

message DeleteAliasRequest {
  string alias = 1;
}

message DeleteAliasResponse {}

message ListModelsRequest {}

message ListModelsResponse {
  repeated ModelAlias aliases = 1;
  repeated ModelVersion versions = 2;
}

message ListWorkersRequest {}

message ListWorkersResponse {
  repeated WorkerSummary workers = 1;
}

service CatalogService {
  rpc SetModelAlias(SetModelAliasRequest) returns (SetModelAliasResponse);
  rpc DeleteModelAlias(DeleteAliasRequest) returns (DeleteAliasResponse);
  rpc ListModels(ListModelsRequest) returns (ListModelsResponse);
  rpc ListWorkers(ListWorkersRequest) returns (ListWorkersResponse);
}
