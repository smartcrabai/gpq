[workspace]
members = [
  "crates/gpq-domain",
  "crates/gpq-proto",
  "crates/gpq-remote",
  "crates/gpq-worker",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/smartcrabai/gpq"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0.100"
async-trait = "0.1.89"
aws-config = { version = "1.8.7", default-features = false, features = [
  "behavior-version-latest",
  "rt-tokio",
  "rustls",
] }
aws-credential-types = "1.2.6"
aws-sdk-s3 = { version = "1.116.0", default-features = false, features = [
  "behavior-version-latest",
  "rt-tokio",
  "rustls",
  "sigv4a",
] }
axum = { version = "0.8.9", features = ["http2", "json", "ws"] }
base64 = "0.23.0"
buffa = { version = "0.8.1", features = ["json"] }
buffa-types = { version = "0.8.1", features = ["chrono", "json"] }
chrono = { version = "0.4.42", default-features = false, features = [
  "clock",
  "serde",
  "std",
] }
clap = { version = "4.5.51", features = ["derive"] }
connectrpc = { version = "0.8.1", features = [
  "axum",
  "client",
  "json",
  "server",
  "streaming",
] }
connectrpc-build = "0.8.0"
futures = "0.3.31"
gpq-domain = { path = "crates/gpq-domain" }
gpq-proto = { path = "crates/gpq-proto" }
hex = "0.4.3"
hmac = "0.13.0"
http = "1.3.1"
hyper = "1.8.1"
ipnet = "2.12.1"
keyring = "4.1.6"
libc = "0.2.189"
opentelemetry = { version = "0.32.0", default-features = false, features = [
  "trace",
] }
opentelemetry-otlp = { version = "0.32.0", features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio", "trace"] }
percent-encoding = "2.3"
rand = "0.10.0"
reqwest = { version = "0.13.0", default-features = false, features = [
  "json",
  "multipart",
  "query",
  "rustls",
  "stream",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", default-features = false, features = [
  "chrono",
  "json",
  "macros",
  "migrate",
  "postgres",
  "runtime-tokio",
  "tls-rustls-ring",
  "uuid",
] }
tempfile = "3.24.0"
testcontainers = "0.27.3"
testcontainers-modules = { version = "0.15.0", features = [
  "minio",
  "postgres",
] }
thiserror = "2.0.17"
tokio = { version = "1.53.1", features = [
  "fs",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tokio-tungstenite = { version = "0.30.0", features = [
  "rustls-tls-webpki-roots",
] }
tokio-util = { version = "0.7.17", features = ["io", "rt"] }
toml = "1.1.4"
tower-http = { version = "0.7.0", features = ["trace"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = { version = "2.5.7", features = ["serde"] }
uuid = { version = "1.18.1", features = ["serde", "v7"] }
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[workspace.lints.clippy]
allow_attributes = "deny"
dbg_macro = "deny"
expect_used = "deny"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"

[profile.dist]
inherits = "release"

[profile.release]
codegen-units = 1
lto = true
strip = true

[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
ci = "github"
install-path = "CARGO_HOME"
installers = ["shell", "homebrew"]
precise-builds = true
publish-jobs = ["homebrew"]
tap = "smartcrabai/homebrew-tap"
targets = [
  "aarch64-apple-darwin",
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
  "aarch64-pc-windows-msvc",
]

[workspace.metadata.dist.github-action-commits]
"actions/checkout" = "d23441a48e516b6c34aea4fa41551a30e30af803"
"actions/download-artifact" = "3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c"
"actions/upload-artifact" = "043fb46d1a93c77aae656e7c1c64a875d1fc6a0a"
